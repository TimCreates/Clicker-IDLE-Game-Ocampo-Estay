<!DOCTYPE html>
<html>
<head>
  <title>Idle RPG Battler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>⚔️ Idle RPG Battler</h1>

  <div class="box">
    <h2>Player</h2>
    <p>HP: <span id="playerHp"></span></p>
    <p>Attack: <span id="playerAtk"></span></p>
    <p>Defense: <span id="playerDef"></span></p>
    <p>Gold: <span id="gold"></span></p>
  </div>

  <div class="box">
    <h2>Enemy (Level <span id="enemyLvl"></span>)</h2>
    <p>HP: <span id="enemyHp"></span></p>
  </div>

  <div class="box">
    <h2>Upgrades</h2>
    <button onclick="upgradeAttack()">Upgrade Attack (+2) [20 gold]</button>
    <button onclick="upgradeDefense()">Upgrade Defense (+1) [15 gold]</button>
  </div>
  <div class="battlefield">
  <div class="character">
    <img id="playerImg" src="https://i.imgur.com/6X12F6v.png">
    <p>🧙 Player</p>
  </div>

  <div class="character">
    <img id="enemyImg" src="https://i.imgur.com/Z6X8FqT.png">
    <p>👹 Enemy</p>
  </div>
</div>

  <script src="game.js"></script>
</body>
</html>
